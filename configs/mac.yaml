detection:
  model: yolo26m.pt
  confidence: 0.35
  minimum_vehicle_area_ratio: 0
  duplicate_vehicle_iou_threshold: 0.85
  duplicate_vehicle_containment_threshold: 0.9
  duplicate_vehicle_center_distance_ratio: 0.22
  imgsz: 1280
  device: mps
  classes: [car, motorcycle, bus, truck]
tracking:
  tracker: botsort.yaml
  minimum_track_length: 2
output:
  save_video: true
  save_frames: true
  codec: mp4v
logging:
  level: INFO
