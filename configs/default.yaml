detection:
  model: yolo26m.pt
  confidence: 0.35
  minimum_vehicle_area_ratio: 0.001
  imgsz: 1280
  device: auto
  classes:
    - car
    - motorcycle
    - bus
    - truck
    - bicycle

tracking:
  tracker: botsort.yaml
  minimum_track_length: 2

output:
  save_video: true
  save_frames: true
  codec: mp4v

logging:
  level: INFO
