detection:
  model: yolo26m.pt
  confidence: 0.35
  imgsz: 1280
  device: mps
  classes: [car, motorcycle, bus, truck, person, bicycle]
tracking:
  tracker: botsort.yaml
  minimum_track_length: 2
lane_geometry:
  enabled: true
  mode: dynamic
  lanes:
    - id: lane_left
      lateral_order: 0
      polygon:
        - { x: 0.38, y: 0.45 }
        - { x: 0.44, y: 0.45 }
        - { x: 0.10, y: 1.00 }
        - { x: 0.00, y: 1.00 }
    - id: lane_center
      lateral_order: 1
      polygon:
        - { x: 0.44, y: 0.45 }
        - { x: 0.50, y: 0.45 }
        - { x: 0.76, y: 1.00 }
        - { x: 0.10, y: 1.00 }
    - id: lane_right
      lateral_order: 2
      polygon:
        - { x: 0.50, y: 0.45 }
        - { x: 0.56, y: 0.45 }
        - { x: 1.00, y: 1.00 }
        - { x: 0.76, y: 1.00 }
  boundaries:
    - id: boundary_left
      left_lane_id: lane_left
      right_lane_id: lane_center
      points: [{ x: 0.44, y: 0.45 }, { x: 0.10, y: 1.00 }]
    - id: boundary_right
      left_lane_id: lane_center
      right_lane_id: lane_right
      points: [{ x: 0.50, y: 0.45 }, { x: 0.76, y: 1.00 }]
  confidence: 1.0
  dynamic:
    backend: yolop_onnx
    weights: /tmp/dynamic-lane-prototypes.KPdQ9h/YOLOP/weights/yolop-640-640.onnx
    road_roi:
      - { x: 0.05, y: 1.00 }
      - { x: 0.35, y: 0.35 }
      - { x: 0.65, y: 0.35 }
      - { x: 0.95, y: 1.00 }
    minimum_confidence: 0.70
    minimum_curve_fit_confidence: 0.60
    missing_frame_tolerance: 10
    smoothing_alpha: 0.25
    maximum_boundary_jump_ratio: 0.08
    topology_confirmation_frames: 6
    maximum_lane_count: 3
    minimum_boundary_separation_ratio: 0.08
    canny_low_threshold: 50
    canny_high_threshold: 150
    hough_threshold: 30
    minimum_line_length_pixels: 40
    maximum_line_gap_pixels: 40
    minimum_absolute_slope: 0.30
    boundary_cluster_distance_ratio: 0.08
    curve_sample_count: 8
    yolop_input_size: 640
    yolop_segmentation_threshold: 0.50
    yolop_minimum_component_area_ratio: 0.0001
lane_membership:
  boundary_margin_pixels: 12.0
  minimum_geometry_confidence: 0.5
ego_motion:
  max_features: 500
  feature_quality_level: 0.01
  feature_min_distance: 8.0
  optical_flow_window_size: 21
  optical_flow_max_level: 3
  ransac_reprojection_threshold: 3.0
  minimum_tracked_features: 12
  minimum_inliers: 8
  minimum_inlier_ratio: 0.5
  maximum_mean_reprojection_error: 2.5
  mask_padding_pixels: 8
relative_motion:
  enabled: true
  stationary_residual_ratio: 0.001
  maximum_projection_margin_ratio: 0.25
  minimum_valid_observations: 2
  minimum_cumulative_lateral_ratio: 0.003
  minimum_directional_consistency: 0.6
  minimum_scene_consistency: 0.8
  maximum_stationary_ratio: 0.5
  scene_minimum_tracks: 3
  scene_lateral_motion_ratio: 0.003
  scene_consensus_ratio: 0.75
temporal_lane:
  smoothing_window_frames: 3
  approaching_distance_pixels: 40.0
  entered_distance_pixels: 20.0
  debounce_frames: 2
  minimum_confirmation_frames: 3
  minimum_confirmation_duration_seconds: 0.1
  maximum_missing_frames: 2
  candidate_timeout_seconds: 2.0
  history_size: 30
output:
  save_video: true
  save_frames: true
  codec: mp4v
logging:
  level: INFO
